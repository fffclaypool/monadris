version = "3.11.0"
runner.dialect = scala3

maxColumn = 120

# Indentation
indent.main = 2
indent.defnSite = 2
indent.callSite = 2
indent.extendSite = 2

# Alignment (whether to align tokens such as = and ->)
align.preset = more

# Doc comment style
docstrings.style = Asterisk
docstrings.wrap = no

# Rewrite rules (kept minimal; import sorting etc. is left to Scalafix)
rewrite.rules = [
  RedundantBraces,  # Remove redundant {}
  RedundantParens,  # Remove redundant ()
  SortModifiers,    # Consistent modifier order (e.g. private final -> final private)
  PreferCurlyFors   # Use {} for for-comprehensions
]

rewrite.scala3.convertToNewSyntax = true # Use the new control syntax
rewrite.scala3.removeOptionalBraces = yes # Convert braces to indentation syntax (yes/no to taste)
