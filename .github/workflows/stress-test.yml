name: Stress Test

on:
  schedule:
    # Every Sunday at 03:00 UTC (12:00 JST)
    - cron: '0 3 * * 0'
  workflow_dispatch:
    # Can also be triggered manually

jobs:
  stress-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'sbt'

    - name: Setup sbt
      uses: sbt/setup-sbt@v1

    - name: Run stress tests
      run: sbt stressTest
